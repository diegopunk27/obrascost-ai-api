services:
  - type: web
    name: obrascost-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      # Set at least one of these in the Render dashboard:
      # - GROQ_API_KEY
      # - CEREBRAS_API_KEY
      # - OPENROUTER_API_KEY
